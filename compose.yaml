services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${STUBLINE_DB_NAME:-stubline}
      POSTGRES_USER: ${STUBLINE_DB_USER:?Set STUBLINE_DB_USER}
      POSTGRES_PASSWORD: ${STUBLINE_DB_PASSWORD:?Set STUBLINE_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 10
