services:
  otel-collector:
    stop_grace_period: 15s
    image: stubline/otel-collector:0.164.0
    build:
      context: .
      dockerfile: observability/collector.Dockerfile
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/collector.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 3
  otel-lgtm:
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9091:9090"
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning/dashboards:ro
  postgres:
    stop_grace_period: 15s
    image: postgres:18.6-alpine3.24
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${STUBLINE_POSTGRES_PASSWORD:?copy .env.example to .env}
      STUBLINE_INVENTORY_DB_PASSWORD: ${STUBLINE_INVENTORY_DB_PASSWORD:?copy .env.example to .env}
      STUBLINE_TICKETING_DB_PASSWORD: ${STUBLINE_TICKETING_DB_PASSWORD:?copy .env.example to .env}
      STUBLINE_NOTIFICATIONS_DB_PASSWORD: ${STUBLINE_NOTIFICATIONS_DB_PASSWORD:?copy .env.example to .env}
    volumes:
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 10
    cpus: 1.0
    mem_limit: 512m
  kafka:
    stop_grace_period: 15s
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "order-placed", "--partitions", "3", "--replication-factor", "1"]
  seaweedfs:
    stop_grace_period: 15s
    image: chrislusf/seaweedfs:4.46
    environment:
      AWS_ACCESS_KEY_ID: ${STUBLINE_S3_ACCESS_KEY:?copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${STUBLINE_S3_SECRET_KEY:?copy .env.example to .env}
      S3_BUCKET: stubline-tickets
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
  payment-provider-stub:
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: payment-provider-stub/Dockerfile
    environment:
      OTEL_SERVICE_NAME: payment-provider-stub
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      PROVIDER_PORT: "8081"
      PROVIDER_LATENCY_MS: "0"
      PROVIDER_ERROR_RATE: "0"
      PROVIDER_OUTAGE: "false"
    ports:
      - "127.0.0.1:8081:8081"
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "http://localhost:8081/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
  inventory-service:
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      STUBLINE_JDBC_URL: jdbc:postgresql://postgres:5432/inventory
      STUBLINE_DB_USER: inventory
      OTEL_SERVICE_NAME: inventory-service
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      STUBLINE_DB_PASSWORD: ${STUBLINE_INVENTORY_DB_PASSWORD:?copy .env.example to .env}
      STUBLINE_GRPC_CA: /certs/internal-ca.crt
      STUBLINE_GRPC_CERT: /certs/inventory-service.crt
      STUBLINE_GRPC_KEY: /certs/inventory-service.key
      STUBLINE_GRPC_CLIENT_CERT: /certs/inventory-health.crt
      STUBLINE_GRPC_CLIENT_KEY: /certs/inventory-health.key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./certs/dev/inventory:/certs:ro
    healthcheck:
      test: ["CMD", "java", "-cp", "app.jar:lib/*", "com.elsworne.stubline.inventory.service.GrpcHealthCheck"]
      interval: 5s
      timeout: 3s
      retries: 10
  dev-token-issuer:
    stop_grace_period: 15s
    environment:
      STUBLINE_TLS_KEYSTORE: /certs/dev-token-issuer.p12
      STUBLINE_TLS_PASSWORD: ${STUBLINE_TLS_PASSWORD:?copy .env.example to .env}
      OTEL_SERVICE_NAME: dev-token-issuer
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    build:
      context: .
      dockerfile: dev-token-issuer/Dockerfile
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./certs/dev/issuer:/certs:ro
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:8443/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
  ticketing-api:
    stop_grace_period: 40s
    build:
      context: .
      dockerfile: ticketing-api/Dockerfile
    environment:
      STUBLINE_JDBC_URL: jdbc:postgresql://postgres:5432/ticketing
      STUBLINE_DB_USER: ticketing
      OTEL_SERVICE_NAME: ticketing-api
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      STUBLINE_DB_PASSWORD: ${STUBLINE_TICKETING_DB_PASSWORD:?copy .env.example to .env}
      STUBLINE_TLS_KEYSTORE: /certs/ticketing-api.p12
      STUBLINE_TLS_PASSWORD: ${STUBLINE_TLS_PASSWORD:?copy .env.example to .env}
      STUBLINE_GRPC_CA: /certs/internal-ca.crt
      STUBLINE_GRPC_CERT: /certs/ticketing-client.crt
      STUBLINE_GRPC_KEY: /certs/ticketing-client.key
      STUBLINE_JWKS_URI: https://dev-token-issuer:8443/.well-known/jwks.json
      STUBLINE_JWKS_CA: /certs/public-ca.crt
      STUBLINE_JWT_ISSUER: https://dev-token-issuer:8443
      STUBLINE_CORS_ORIGINS: ${STUBLINE_CORS_ORIGINS:-}
      STUBLINE_PAYMENT_PROVIDER_URL: http://payment-provider-stub:8081
      STUBLINE_INVENTORY_HOST: inventory-service
      STUBLINE_INVENTORY_PORT: "9090"
      STUBLINE_KAFKA_BOOTSTRAP: kafka:9092
      STUBLINE_S3_BUCKET: stubline-tickets
      STUBLINE_S3_ENDPOINT: http://seaweedfs:8333
      STUBLINE_S3_PUBLIC_ENDPOINT: http://localhost:8333
      STUBLINE_S3_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${STUBLINE_S3_ACCESS_KEY:?copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${STUBLINE_S3_SECRET_KEY:?copy .env.example to .env}
    depends_on:
      seaweedfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
      payment-provider-stub:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      dev-token-issuer:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./certs/dev/api:/certs:ro
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:8080/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
  notification-service:
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      STUBLINE_JDBC_URL: jdbc:postgresql://postgres:5432/notifications
      STUBLINE_DB_USER: notifications
      OTEL_SERVICE_NAME: notification-service
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      STUBLINE_DB_PASSWORD: ${STUBLINE_NOTIFICATIONS_DB_PASSWORD:?copy .env.example to .env}
      STUBLINE_KAFKA_BOOTSTRAP: kafka:9092
      STUBLINE_PAUSE_BEFORE_COMMIT_MS: ${STUBLINE_PAUSE_BEFORE_COMMIT_MS:-0}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "http://localhost:8084/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  seaweedfs_data:
