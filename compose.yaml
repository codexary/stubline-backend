services:
  postgres:
    stop_grace_period: 15s
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${STUBLINE_DB_PASSWORD:?Set STUBLINE_DB_PASSWORD}
      STUBLINE_DB_PASSWORD: ${STUBLINE_DB_PASSWORD:?Set STUBLINE_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 10
    cpus: 1.0
    mem_limit: 512m
  kafka:
    stop_grace_period: 15s
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
  seaweedfs:
    stop_grace_period: 15s
    image: chrislusf/seaweedfs:4.46
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: stubline-tickets
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "order-placed", "--partitions", "3", "--replication-factor", "1"]
  payment-provider-stub:
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: payment-provider-stub/Dockerfile
    environment:
      PROVIDER_PORT: "8081"
      PROVIDER_LATENCY_MS: "0"
      PROVIDER_ERROR_RATE: "0"
      PROVIDER_OUTAGE: "false"
    ports:
      - "127.0.0.1:8081:8081"
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
  inventory-service:
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      STUBLINE_JDBC_URL: jdbc:postgresql://postgres:5432/inventory
      STUBLINE_DB_USER: inventory
      STUBLINE_DB_PASSWORD: ${STUBLINE_DB_PASSWORD:?Set STUBLINE_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "java", "-cp", "app.jar:lib/*", "com.elsworne.stubline.inventory.service.GrpcHealthCheck"]
      interval: 5s
      timeout: 3s
      retries: 10
  ticketing-api:
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: ticketing-api/Dockerfile
    environment:
      STUBLINE_JDBC_URL: jdbc:postgresql://postgres:5432/ticketing
      STUBLINE_DB_USER: ticketing
      STUBLINE_DB_PASSWORD: ${STUBLINE_DB_PASSWORD:?Set STUBLINE_DB_PASSWORD}
      STUBLINE_PAYMENT_PROVIDER_URL: http://payment-provider-stub:8081
      STUBLINE_INVENTORY_TARGET: inventory-service:9090
      STUBLINE_KAFKA_BOOTSTRAP: kafka:9092
      STUBLINE_S3_BUCKET: stubline-tickets
      STUBLINE_S3_ENDPOINT: http://seaweedfs:8333
      STUBLINE_S3_PUBLIC_ENDPOINT: http://localhost:8333
      STUBLINE_S3_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
    depends_on:
      seaweedfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
      payment-provider-stub:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
  notification-service:
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      STUBLINE_JDBC_URL: jdbc:postgresql://postgres:5432/notifications
      STUBLINE_DB_USER: notifications
      STUBLINE_DB_PASSWORD: ${STUBLINE_DB_PASSWORD:?Set STUBLINE_DB_PASSWORD}
      STUBLINE_KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "java", "-cp", "app.jar:lib/*", "com.elsworne.stubline.notification.NotificationHealthCheck"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  seaweedfs_data:
