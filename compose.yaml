services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${STUBLINE_DB_NAME:-stubline}
      POSTGRES_USER: ${STUBLINE_DB_USER:?Set STUBLINE_DB_USER}
      POSTGRES_PASSWORD: ${STUBLINE_DB_PASSWORD:?Set STUBLINE_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 10
    cpus: 1.0
    mem_limit: 512m
    stop_grace_period: 15s
  payment-provider-stub:
    build:
      context: .
      dockerfile: payment-provider-stub/Dockerfile
    environment:
      PROVIDER_PORT: "8081"
      PROVIDER_LATENCY_MS: "0"
      PROVIDER_ERROR_RATE: "0"
      PROVIDER_OUTAGE: "false"
    ports:
      - "127.0.0.1:8081:8081"
    cpus: 0.5
    mem_limit: 256m
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
  ticketing-api:
    build:
      context: .
      dockerfile: ticketing-api/Dockerfile
    environment:
      STUBLINE_JDBC_URL: jdbc:postgresql://postgres:5432/stubline
      STUBLINE_DB_USER: ${STUBLINE_DB_USER:?Set STUBLINE_DB_USER}
      STUBLINE_DB_PASSWORD: ${STUBLINE_DB_PASSWORD:?Set STUBLINE_DB_PASSWORD}
      STUBLINE_PAYMENT_PROVIDER_URL: http://payment-provider-stub:8081
    depends_on:
      postgres:
        condition: service_healthy
      payment-provider-stub:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    cpus: 1.0
    mem_limit: 512m
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
